[build]
  command = "npm run build"
  publish = "dist"

# The embed script may be loaded by any site.
[[headers]]
  for = "/embed.js"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

# The headerless widget is meant to be framed by other sites.
[[headers]]
  for = "/embed"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
